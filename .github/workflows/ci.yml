name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_TELEMETRY_DISABLED: "1"

  integration-e2e:
    # Real Supabase service images (Postgres, Auth, Storage, PostgREST) via scripts/local-stack.sh.
    # The AI provider in E2E is a LOCAL CONTRACT STUB; nothing here calls a live external service.
    runs-on: ubuntu-latest
    needs: unit
    defaults: { run: { working-directory: app } }
    env:
      TS_STACK_DIR: ${{ runner.temp }}/ts-stack
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: scripts/local-stack.sh up
      - name: Start gateway and FASHN contract stub
        run: |
          nohup node scripts/dev-gateway.mjs > gateway.log 2>&1 &
          nohup node scripts/fashn-stub.mjs > stub.log 2>&1 &
          sleep 2
      - name: Write test environment (ephemeral, generated per run)
        run: |
          {
            scripts/local-stack.sh env
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3123"
            echo "TRYON_PROVIDER=fashn"
            echo "FASHN_API_KEY=stub-key"
            echo "FASHN_BASE_URL=http://127.0.0.1:54340/v1"
            echo "CRON_SECRET=$(openssl rand -hex 24)"
            echo "SHOPIFY_API_KEY=test-key"
            echo "SHOPIFY_API_SECRET=$(openssl rand -hex 16)"
            echo "SHOPIFY_SCOPES=read_products,read_orders"
            echo "SHOPIFY_TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - run: npm run test:integration
      - run: npm run build
      - name: End-to-end (stubbed provider)
        run: |
          nohup npx next start -p 3123 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3123/privacy && break; sleep 1; done
          E2E_BASE_URL=http://127.0.0.1:3123 npm run test:e2e
      - if: failure()
        run: tail -n 100 next.log gateway.log stub.log || true
      - if: always()
        run: scripts/local-stack.sh down
