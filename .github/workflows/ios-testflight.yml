name: iOS build → TestFlight (manual)

# Builds the iOS app on a GitHub macOS runner and uploads it to TestFlight,
# for anyone without a Mac. Runs only when started by hand (Actions → Run workflow).
#
# Requires an Apple Developer Program membership and these repository secrets
# (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID      10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID         App Store Connect API key ID (Users and Access → Integrations → Keys, role "App Manager")
#   ASC_ISSUER_ID      Issuer ID shown on the same page
#   ASC_KEY_P8_BASE64  The downloaded AuthKey_XXXX.p8 file, base64-encoded (base64 -i AuthKey_XXXX.p8)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version shown in the App Store (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  testflight:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: my-library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-library/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build && npx cap sync ios
      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=${{ inputs.version }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            archive
      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist ios/App/ExportOptions.plist -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
